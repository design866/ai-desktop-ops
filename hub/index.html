<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Dock · AI 应用侧边栏工作台</title>
<style>
  :root{
    --bg:#fcfcfb; --rail:#f6f6f4; --line:#e7e6e2; --line-soft:#efeeea;
    --ink:#1b1b19; --muted:#8a8983; --faint:#b6b5ae;
    --accent:#2f6f57; --accent-soft:#eaf2ee;
    --on:#22c55e; --warn:#e9a23b; --off:#c9c8c2;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;height:100vh}

  /* ── 左栏：注册表 ───────────────────────────────── */
  #rail{
    width:252px;flex:0 0 252px;background:var(--rail);
    border-right:1px solid var(--line);display:flex;flex-direction:column;
  }
  #railHead{padding:14px 16px 10px;border-bottom:1px solid var(--line-soft)}
  #railHead h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.2px}
  #railHead p{margin:2px 0 0;font-size:11px;color:var(--muted)}
  #tabs{display:flex;gap:4px;padding:10px 12px 2px;flex-wrap:wrap}
  .tab{
    border:0;background:transparent;color:var(--muted);cursor:pointer;
    font:inherit;font-size:11.5px;padding:3px 8px;border-radius:6px;
  }
  .tab:hover{background:#eceae6;color:var(--ink)}
  .tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #list{flex:1;overflow-y:auto;padding:8px 10px 16px}
  .row{
    display:flex;align-items:center;gap:9px;width:100%;
    padding:7px 9px;margin:2px 0;border:0;border-radius:8px;
    background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;
  }
  .row:hover{background:#eeedea}
  .row.sel{background:#e9eeeb;box-shadow:inset 0 0 0 1px #dfe6e1}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--off);flex:0 0 7px}
  .dot.on{background:var(--on);box-shadow:0 0 0 3px rgba(34,197,94,.13)}
  .dot.wait{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .meta{min-width:0;flex:1}
  .nm{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kbd{
    font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint);
    border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
    padding:2px 4px;min-width:16px;text-align:center;background:#fff;
  }
  #foot{padding:8px 16px;border-top:1px solid var(--line-soft);font-size:10.5px;color:var(--faint)}
  /* ?rail=1 —— 只显示注册表栏（贴到窄侧栏里时就是这个形态） */
  body.rail-only #stage{display:none}
  body.rail-only #rail{width:100%;flex:1 1 auto;border-right:0}

  /* ── 右侧：舞台 ─────────────────────────────────── */
  #stage{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
  #bar{
    display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;
    border-bottom:1px solid var(--line-soft);flex:0 0 40px;
  }
  #title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #addr{font:11px/1 ui-monospace,Menlo,monospace;color:var(--faint);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
    font:inherit;font-size:11.5px;padding:3px 9px;border-radius:6px;
  }
  .btn:hover{border-color:#d9d8d2;background:#fafaf8}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn[hidden]{display:none}
  #frame{flex:1;border:0;width:100%;background:#fff}
  #frame[hidden]{display:none}
  #empty{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:var(--muted);text-align:center;padding:24px;
  }
  #empty[hidden]{display:none}
  #empty strong{font-size:14px;color:var(--ink);font-weight:600}
  #empty span{font-size:12px;max-width:360px}
  #toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:#1b1b19;color:#fff;font-size:12px;padding:7px 14px;border-radius:8px;
    opacity:0;pointer-events:none;transition:opacity .18s;
  }
  #toast.show{opacity:.94}
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div id="railHead">
      <h1>App Dock</h1>
      <p>AI 应用的侧边栏工作台</p>
    </div>
    <div id="tabs"></div>
    <div id="list"></div>
    <div id="foot">双击条目 = 浏览器中打开</div>
  </aside>
  <main id="stage">
    <div id="bar">
      <span id="title">未选择</span>
      <span id="addr"></span>
      <button class="btn" id="btnStop" hidden>停止</button>
      <button class="btn" id="btnOpen" hidden>外部打开</button>
      <button class="btn primary" id="btnStart" hidden>启动</button>
    </div>
    <iframe id="frame" hidden title="app"></iframe>
    <div id="empty">
      <strong>从左侧挑一个应用</strong>
      <span>运行中的 web 应用会直接嵌在这里；独立窗口程序会被拉起并显示运行状态。</span>
    </div>
  </main>
</div>
<div id="toast"></div>

<script>
const API = location.origin;
if (new URLSearchParams(location.search).get("rail") === "1") {
  document.body.classList.add("rail-only");
}
let APPS = [];
let GROUP = "全部";
let SEL = null;
let toastTimer = 0;

const $ = (id) => document.getElementById(id);

function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

async function getState(){
  try{
    const r = await fetch(API + "/api/state", {cache:"no-store"});
    const data = await r.json();
    APPS = data.apps || [];
  }catch(e){
    APPS = [];
  }
  return APPS;
}

async function post(action, id){
  try{
    const r = await fetch(API + "/api/" + action + "/" + id, {method:"POST"});
    return await r.json();
  }catch(e){
    return {ok:false, msg:"hub 无响应"};
  }
}

function groups(){
  const seen = [];
  APPS.forEach(a => { const g = a.group || "应用"; if(!seen.includes(g)) seen.push(g); });
  return ["全部"].concat(seen);
}

function renderTabs(){
  const box = $("tabs");
  box.innerHTML = "";
  groups().forEach(g => {
    const b = document.createElement("button");
    b.className = "tab" + (g === GROUP ? " on" : "");
    b.textContent = g;
    b.onclick = () => { GROUP = g; renderTabs(); renderList(); };
    box.appendChild(b);
  });
}

function visible(){
  return APPS.filter(a => GROUP === "全部" || (a.group || "应用") === GROUP);
}

function renderList(){
  const box = $("list");
  box.innerHTML = "";
  visible().forEach(a => {
    const b = document.createElement("button");
    b.className = "row" + (SEL === a.id ? " sel" : "");
    b.onclick = () => select(a.id);
    b.ondblclick = () => { if(a.url) window.open(a.url, "_blank"); };

    const d = document.createElement("span");
    d.className = "dot" + (a.alive ? " on" : (a.starting ? " wait" : ""));

    const m = document.createElement("span");
    m.className = "meta";
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = a.name;
    const sb = document.createElement("span");
    sb.className = "sb";
    sb.textContent = a.sub || (a.port ? ":" + a.port : "");
    m.append(nm, sb);

    b.append(d, m);
    if(a.hotkey){
      const k = document.createElement("span");
      k.className = "kbd";
      k.textContent = a.hotkey.toUpperCase();
      b.appendChild(k);
    }
    box.appendChild(b);
  });
}

function setStage(a){
  const frame = $("frame"), empty = $("empty");
  $("title").textContent = a ? a.name : "未选择";
  $("addr").textContent = a ? (a.url || a.exe || "") : "";
  const running = a && a.alive;

  $("btnStart").hidden = !a || running || a.starting;
  $("btnStop").hidden = !a || !running || a.kind !== "web";
  $("btnOpen").hidden = !(a && a.url);

  if(running && a.url){
    if(frame.dataset.id !== a.id){
      frame.dataset.id = a.id;
      frame.src = a.url;
    }
    frame.hidden = false;
    empty.hidden = true;
  }else{
    frame.hidden = true;
    empty.hidden = false;
    if(a){
      empty.querySelector("strong").textContent = a.alive ? a.name : "「" + a.name + "」还没启动";
      empty.querySelector("span").textContent = a.kind === "web"
        ? "点击右上角「启动」，端口通了就嵌到这里。"
        : (a.exists === false ? "登记的 exe 路径不存在，先照实际安装位置改 apps.json。" : "这是独立窗口程序，启动后会在自己的窗口里打开。");
    }else{
      empty.querySelector("strong").textContent = "从左侧挑一个应用";
      empty.querySelector("span").textContent = "运行中的 web 应用会直接嵌在这里；独立窗口程序会被拉起并显示运行状态。";
    }
    frame.dataset.id = "";
    frame.removeAttribute("src");
  }
}

async function select(id, opts){
  const quiet = opts && opts.quiet;
  const a = APPS.find(x => x.id === id);
  if(!a) return;
  SEL = id;
  renderList();
  setStage(a);
  if(quiet) return;
  if(a.alive) return;
  await start(id);
}

async function start(id){
  const a = APPS.find(x => x.id === id);
  if(!a) return;
  $("btnStart").hidden = true;
  a.starting = true;
  renderList();
  const res = await post("start", id);
  if(!res.ok) toast(res.msg || "启动失败");
  // 端口起来需要时间：轮询到 alive 或 40s
  const deadline = Date.now() + 40000;
  while(Date.now() < deadline){
    await sleep(1200);
    await getState();
    const cur = APPS.find(x => x.id === id);
    if(cur && cur.alive) break;
  }
  const cur = APPS.find(x => x.id === id);
  if(cur && !cur.alive) {
    cur.starting = false;
    toast("仍然没有监听端口，看应用自己的日志");
  }
  renderList();
  if(SEL === id) setStage(APPS.find(x => x.id === id));
}

async function stop(id){
  const res = await post("stop", id);
  toast(res.msg || "已发送停止");
  await sleep(600);
  await getState();
  renderList();
  if(SEL === id) setStage(APPS.find(x => x.id === id));
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

$("btnStart").onclick = () => SEL && start(SEL);
$("btnStop").onclick  = () => SEL && stop(SEL);
$("btnOpen").onclick  = () => { const a = APPS.find(x => x.id === SEL); if(a && a.url) window.open(a.url, "_blank"); };

document.addEventListener("keydown", (e) => {
  const t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const list = visible();
  const hit = list.find(a => (a.hotkey || "").toLowerCase() === e.key.toLowerCase());
  if(hit){ e.preventDefault(); select(hit.id); }
});

(async function boot(){
  await getState();
  renderTabs();
  renderList();
  const first = APPS.find(a => a.alive && a.url) || APPS[0];
  if(first) select(first.id, {quiet:true});
  setInterval(async () => { await getState(); renderList(); if(SEL) setStage(APPS.find(x => x.id === SEL)); }, 5000);
})();
</script>
</body>
</html>
